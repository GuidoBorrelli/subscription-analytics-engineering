name: subscription_analytics
version: '1.0.0'
config-version: 2
profile: subscription_analytics
model-paths: [models]
seed-paths: [seeds]
test-paths: [dbt_tests]
clean-targets: [target, dbt_packages]
vars:
  reporting_start: '2025-01-01'
  reporting_end: '2025-12-01'
models:
  subscription_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    +persist_docs:
      relation: true
      columns: true
seeds:
  subscription_analytics:
    plans:
      +column_types:
        plan_id: varchar
        monthly_price_cents: bigint
